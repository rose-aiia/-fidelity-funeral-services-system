openapi: 3.1.0
info:
  title: Fidelity funeral services API
  version: 0.1.0
  description: |
    The endpoints the web app calls today. Paths are relative to the API base URL
    (`VITE_API_BASE_URL`, default `/api`). In development the Vite proxy strips the `/api`
    prefix, so the backend serves these paths from its root.

    `npm run mock-api` runs a reference implementation of this contract.

    **Accounts.** Customers sign in with a Zimbabwean mobile number and a 6-digit one-time code sent
    by SMS. A successful `/auth/signin` or `/auth/signup` sets an `httpOnly`, `SameSite=Lax` cookie named
    `sid` (a production deployment should also set `Secure`). The `/me` endpoints require it and answer
    `401` with code `unauthenticated` when it is missing or no longer valid. Failed code attempts are
    counted per phone number and failed policy-link attempts per user; after 5 the server answers `429`
    with code `locked_out`. National ID numbers held on policy records never leave the server.

    **Memorials.** `/memorials/{slug}` endpoints are public: anyone can read a published memorial, leave a
    tribute and light a candle. If the request carries a valid `sid` cookie it identifies the owner, who can
    also see their own unpublished memorial. An unpublished memorial that is not yours answers `404`
    `not_found`, exactly like one that does not exist. `/me/memorials` endpoints need the session cookie and
    answer `404` (never `403`) for a memorial that belongs to someone else. Visitor tributes start `pending`
    and appear publicly only once the owner approves them. Rate limits answer `429` with code `rate_limited`.

    **Marketplace and orders.** `GET /marketplace/items[/{id}]` is public. `/me/orders` endpoints need the
    session cookie and answer `404` (never `403`) for an order that belongs to someone else. The client sends
    choices only (item, options, quantity, personalisation); the server prices every order and returns the
    authoritative totals. An order starts `awaiting_payment`, and once its payment is `paid` it moves on to
    `confirmed`, `in_progress` and `delivered`. Orders are brought up to date whenever they are read.
servers:
  - url: /api

security: []

paths:
  /plans:
    get:
      summary: List funeral plans
      operationId: listPlans
      responses:
        '200':
          description: Plans in display order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Plan' }

  /marketplace/items:
    get:
      summary: List marketplace products and services
      operationId: listMarketplaceItems
      parameters:
        - name: category
          in: query
          required: false
          description: Optional server-side filter. The app currently fetches everything and filters locally.
          schema: { type: string }
      responses:
        '200':
          description: Items in display order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MarketplaceItem' }

  /marketplace/items/{id}:
    get:
      summary: One marketplace product or service
      operationId: getMarketplaceItem
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceItem' }
        '404':
          description: Code `not_found`. No such item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /faqs:
    get:
      summary: List frequently asked questions
      operationId: listFaqs
      responses:
        '200':
          description: Questions in display order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Faq' }

  /quote-requests:
    post:
      summary: Submit a quote request
      operationId: submitQuoteRequest
      description: |
        The client sends only the family's choices. The server computes the total itself and
        returns it; the figure shown in the browser before submitting is a preview, never trusted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '201':
          description: Request accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteReceipt' }
        '422':
          description: Validation failed. `details` maps field names to messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: Rate limited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/otp:
    post:
      summary: Send a one-time sign-in code by SMS
      operationId: requestOtp
      description: Used for both sign-in and sign-up. Does not reveal whether an account exists for the number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { $ref: '#/components/schemas/Phone' }
      responses:
        '200':
          description: Code sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpReceipt' }
        '422':
          description: Not a Zimbabwean mobile number. `details.phone` holds the message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: Code `locked_out`, after 5 failed code attempts for this number.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/signin:
    post:
      summary: Sign in with a phone number and one-time code
      operationId: signIn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignInRequest' }
      responses:
        '200':
          description: Signed in. Sets the `sid` session cookie.
          headers:
            Set-Cookie:
              description: "`sid=<token>; HttpOnly; Path=/; SameSite=Lax`"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401':
          description: Code `otp_invalid`. The code is wrong or expired; this counts toward the lockout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Code `account_not_found`. The code was right but no account uses this number.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Validation failed. `details` maps `phone` / `code` to messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: Code `locked_out`, after 5 failed code attempts for this number.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/signup:
    post:
      summary: Create a customer account
      operationId: signUp
      description: The new account always has role `customer` and language `en`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignUpRequest' }
      responses:
        '201':
          description: Account created and signed in. Sets the `sid` session cookie.
          headers:
            Set-Cookie:
              description: "`sid=<token>; HttpOnly; Path=/; SameSite=Lax`"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401':
          description: Code `otp_invalid`. This counts toward the lockout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Code `account_exists`. The number already has an account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Validation failed. `details` maps `name`, `email`, `phone` or `code` to messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: Code `locked_out`, after 5 failed code attempts for this number.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/signout:
    post:
      summary: Sign out
      operationId: signOut
      description: Ends the session and clears the cookie. Succeeds even when there is no session.
      responses:
        '204':
          description: Signed out. Clears the `sid` cookie.
          headers:
            Set-Cookie:
              description: "`sid=; HttpOnly; Path=/; SameSite=Lax; Max-Age=0`"
              schema: { type: string }

  /me:
    get:
      summary: The signed-in user
      operationId: getMe
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      summary: Update the signed-in user's profile
      operationId: updateMe
      description: The phone number and role cannot be changed here.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: The updated user. Omitting `email` (or sending it empty) removes it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: Validation failed. `details` maps `name`, `email` or `language` to messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/policy:
    get:
      summary: The user's linked policy
      operationId: getMyPolicy
      security:
        - cookieAuth: []
      responses:
        '200':
          description: The linked policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '204':
          description: No policy is linked to this account yet.
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      summary: Link a policy to the account
      operationId: linkPolicy
      description: |
        Proves the person holds the policy by matching the policy number and ID number against the
        back-office record (case, spaces and punctuation are ignored). Replaces any policy already linked.
        The ID number is only ever received, never returned.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkPolicyRequest' }
      responses:
        '200':
          description: The policy is now linked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: |
            Code `policy_not_found` when the number and ID don't match a record (counts toward the lockout),
            or `validation_failed` (`details.policyNumber` / `details.idNumber`) when a field is empty.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: Code `locked_out`, after 5 failed link attempts by this user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/requests:
    get:
      summary: The user's assistance requests
      operationId: listMyRequests
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Requests, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AssistanceRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      summary: Ask the funeral home for help
      operationId: createRequest
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewRequest' }
      responses:
        '201':
          description: Request recorded with status `received`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistanceRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: |
            Validation failed. `details` maps `kind`, `contactPreference` or `message` to messages. `message`
            is capped at 600 characters, and for kind `general` it is required (at least 10 characters).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /memorials/{slug}:
    get:
      summary: A memorial's public page
      operationId: getMemorial
      description: |
        Never includes the owner. Anonymous callers get `404` `not_found` for a memorial that does not exist
        or is unpublished; its owner (identified by the session cookie, if sent) can read it either way.
      security:
        - {}
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: The memorial.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Memorial' }
        '404': { $ref: '#/components/responses/MemorialNotFound' }

  /memorials/{slug}/tributes:
    get:
      summary: Approved tributes for a memorial
      operationId: listTributes
      description: Approved tributes only, newest first. Pending and removed tributes are never public.
      security:
        - {}
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: The tribute wall.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tribute' }
        '404': { $ref: '#/components/responses/MemorialNotFound' }
    post:
      summary: Leave a tribute
      operationId: createTribute
      description: |
        The tribute is `pending` until the owner approves it, except when the caller is the memorial's owner
        (identified by the session cookie), in which case it is `approved` immediately. Limited to 5 tributes
        per memorial per visitor (IP address) per hour.
      security:
        - {}
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewTribute' }
      responses:
        '201':
          description: The stored tribute, with its status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tribute' }
        '404': { $ref: '#/components/responses/MemorialNotFound' }
        '422':
          description: Validation failed. `details` maps `authorName`, `relationship` or `message` to messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /memorials/{slug}/offerings:
    post:
      summary: Light a candle or leave a flower
      operationId: createOffering
      description: |
        Increments the memorial's flower or candle counter. Limited to 20 offerings per memorial per visitor
        (IP address) per day.
      security:
        - {}
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfferingRequest' }
      responses:
        '200':
          description: The new totals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfferingResult' }
        '404': { $ref: '#/components/responses/MemorialNotFound' }
        '422':
          description: Validation failed. `details.kind` holds the message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me/memorials:
    get:
      summary: The signed-in user's memorials
      operationId: listMyMemorials
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Memorials owned by the user, newest first, published or not.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OwnedMemorial' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      summary: Create a memorial
      operationId: createMemorial
      description: |
        Creates an unpublished memorial with an empty biography, timeline and photos and zero flowers and
        candles. The slug is derived from the name and made unique (`grace-nyathi`, `grace-nyathi-2`, ...);
        it never changes afterwards.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewMemorial' }
      responses:
        '201':
          description: The new memorial.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnedMemorial' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: |
            Validation failed. `details` maps `name`, `born`, `died`, `tagline` or `location` to messages.
            Dates must be real `YYYY-MM-DD` dates, and `died` cannot be before `born` or in the future.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/memorials/{id}:
    get:
      summary: One of the user's memorials
      operationId: getMyMemorial
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/MemorialId'
      responses:
        '200':
          description: The memorial with moderation counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnedMemorial' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/MemorialNotFound' }
    patch:
      summary: Update a memorial
      operationId: updateMemorial
      description: |
        Only the fields present are changed. `timeline` replaces the whole list and is stored sorted by year.
        The slug never changes, even when the name does. Publishing has no preconditions. Sending an empty
        `tagline` or `location` removes it.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/MemorialId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemorialUpdate' }
      responses:
        '200':
          description: The updated memorial.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnedMemorial' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/MemorialNotFound' }
        '422':
          description: |
            Validation failed. `details` is keyed by field (`name`, `born`, `died`, `tagline`, `location`,
            `biography`, `timeline`, `service`, `portraitId`, `published`); for `timeline` and `service` it holds
            one message for the whole value. `portraitId` must be the id of one of the memorial's photos, or null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      summary: Delete a memorial
      operationId: deleteMemorial
      description: Permanently removes the memorial, its photos and its tributes, and frees the slug.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/MemorialId'
      responses:
        '204':
          description: Deleted.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/MemorialNotFound' }

  /me/memorials/{id}/photos:
    post:
      summary: Add a photo
      operationId: addMemorialPhoto
      description: |
        **Interim.** The photo travels as a base64 `data:` URL inside JSON, and the server stores it as the
        photo's `url`. A production API should accept `multipart/form-data` (or a pre-signed upload to object
        storage), validate and resize the image, scan it, and return a hosted URL instead.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/MemorialId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewPhoto' }
      responses:
        '201':
          description: The stored photo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemorialPhoto' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/MemorialNotFound' }
        '422':
          description: |
            Code `photo_limit` when the memorial already holds 8 photos, or `validation_failed` with
            `details.dataUrl` (not a JPEG, PNG, WebP or SVG data URL, or over about 1.5 MB) or `details.caption`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/memorials/{id}/photos/{photoId}:
    patch:
      summary: Change a photo's caption
      operationId: updateMemorialPhoto
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/MemorialId'
        - $ref: '#/components/parameters/PhotoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [caption]
              properties:
                caption:
                  type: string
                  maxLength: 140
                  description: An empty string removes the caption.
      responses:
        '200':
          description: The updated photo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemorialPhoto' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404':
          description: Code `not_found`. No such memorial (or it is not yours), or no such photo on it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Validation failed. `details.caption` holds the message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      summary: Remove a photo
      operationId: deleteMemorialPhoto
      description: Clears the memorial's `portraitId` if it pointed at this photo.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/MemorialId'
        - $ref: '#/components/parameters/PhotoId'
      responses:
        '204':
          description: Removed.
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404':
          description: Code `not_found`. No such memorial (or it is not yours), or no such photo on it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/memorials/{id}/tributes:
    get:
      summary: Tributes awaiting or past moderation
      operationId: listMemorialTributesForOwner
      description: Every tribute except `removed` ones, newest first, whatever its status.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/MemorialId'
      responses:
        '200':
          description: Pending and approved tributes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tribute' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/MemorialNotFound' }

  /me/memorials/{id}/tributes/{tributeId}:
    patch:
      summary: Approve or remove a tribute
      operationId: moderateTribute
      description: |
        `approved` publishes a pending tribute. `removed` takes it down from the public wall and from the
        owner's list; it cannot be undone through the API.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/MemorialId'
        - name: tributeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [approved, removed]
      responses:
        '200':
          description: The updated tribute.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tribute' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404':
          description: Code `not_found`. No such memorial (or it is not yours), or no such (or already removed) tribute.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Validation failed. `details.status` holds the message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/orders:
    get:
      summary: The user's marketplace orders
      operationId: listMyOrders
      description: |
        Newest first. Each order is brought up to date before it is returned (a pending payment that has been
        answered, a paid order that has moved to its next stage).
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Orders owned by the user.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      summary: Place an order and start its payment
      operationId: createOrder
      description: |
        The client sends choices only; the server looks every item up and computes the prices, the delivery fee
        and the total, and ignores anything the client might say about money. The order is created
        `awaiting_payment` with a `pending` payment.

        Validation runs delivery, then payment, then lines, and reports everything it finds in one `422`:
        `details` keys are `delivery.<field>` (`recipientName`, `phone`, `town`, `address`, `neededBy`, `note`),
        `payment.<field>` (`method`, `ecocashNumber`), and `lines` (the list as a whole) or `lines.<n>` (the
        n-th line, counting from 0; only the first bad line is reported). `inMemoryOf` is reported as itself.

        Limited to 10 orders per user per hour.

        **Payment.** For `ecocash` the buyer approves a prompt on their phone and the payment settles by itself;
        poll `GET /me/orders/{id}` until `payment.status` leaves `pending`. A production `paynow` payment would
        return a redirect URL to Paynow's hosted page and settle through a webhook; this contract carries no
        such URL yet. **Mock only:** the reference server has no hosted page, so `paynow` settles by itself,
        exactly like EcoCash, and the EcoCash number `+263780000000` is always declined.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewOrder' }
      responses:
        '201':
          description: The order, `awaiting_payment`, with payment `pending`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: Code `validation_failed`. `details` is keyed as described above.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me/orders/{id}:
    get:
      summary: One of the user's orders
      operationId: getMyOrder
      description: Brought up to date before it is returned. This is the source of truth for the order and its payment.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/OrderNotFound' }

  /me/orders/{id}/payment:
    post:
      summary: Start a new payment attempt
      operationId: payOrder
      description: |
        For retrying after a failed payment, or paying another way. Replaces the order's `payment` with a new
        `pending` one (its `reference` ends in the next `-P<n>`) and sets the status to `awaiting_payment`.
        Only orders that are `awaiting_payment` or `payment_failed` can be paid.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentInput' }
      responses:
        '200':
          description: The order with its new pending payment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/OrderNotFound' }
        '409':
          description: Code `order_not_payable`. The order is not `awaiting_payment` or `payment_failed` (it is already paid, or cancelled).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Validation failed. `details` maps `method` or `ecocashNumber` to messages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: Opaque session id set by `/auth/signin` and `/auth/signup`. `httpOnly`, `SameSite=Lax`.

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      description: The memorial's public address, `Memorial.slug`.
      schema: { type: string, examples: [grace-nyathi] }
    MemorialId:
      name: id
      in: path
      required: true
      description: '`Memorial.id`.'
      schema: { type: string, examples: [m-1] }
    PhotoId:
      name: photoId
      in: path
      required: true
      schema: { type: string, examples: [p-1] }
    ItemId:
      name: id
      in: path
      required: true
      description: '`MarketplaceItem.id`.'
      schema: { type: string, examples: [wreath-package] }
    OrderId:
      name: id
      in: path
      required: true
      description: '`Order.id`.'
      schema: { type: string, examples: [o-1039] }

  responses:
    Unauthenticated:
      description: Code `unauthenticated`. No session cookie, or it has expired. The app signs the user out.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    MemorialNotFound:
      description: |
        Code `not_found`. No such memorial, or (on `/memorials/{slug}`) it is unpublished and the caller is not
        its owner, or (on `/me/memorials/{id}`) it belongs to someone else. Never `403`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    OrderNotFound:
      description: Code `not_found`. No such order, or it belongs to someone else. Never `403`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Code `rate_limited`. Too many requests from this visitor or user; try again later.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Plan:
      type: object
      required: [id, name, price, description, features]
      properties:
        id: { type: string, examples: [comfort] }
        name: { type: string, examples: [Comfort] }
        price:
          type: integer
          description: Starting price in whole US dollars.
          examples: [7800]
        description: { type: string }
        features:
          type: array
          items: { type: string }
        popular:
          type: boolean
          description: Highlights the plan as "Most chosen".

    MarketplaceItem:
      type: object
      required: [id, category, title, description, price, accent]
      properties:
        id: { type: string }
        category: { type: string, examples: [Flowers] }
        title: { type: string }
        description: { type: string }
        price:
          type: integer
          description: Price in whole US dollars.
        accent:
          type: string
          description: A decorative glyph, shown when there is no `image`.
        image:
          type: string
          description: An image URL (hosted on a CDN in production). The mock server returns a `data:` URI.
        provider:
          type: string
          description: Who supplies and fulfils the item.
          examples: [Msasa Florists]
        leadTime:
          type: string
          description: How long it takes, for display.
          examples: [Same day in town]
        fulfilment: { $ref: '#/components/schemas/Fulfilment' }
        details:
          type: string
          description: Longer description for the item page.
        includes:
          type: array
          items: { type: string }
        options:
          type: array
          items: { $ref: '#/components/schemas/OptionGroup' }
        personalisation: { $ref: '#/components/schemas/Personalisation' }

    Fulfilment:
      type: string
      enum: [delivery, service]
      description: |
        `delivery` items are physical and incur the delivery fee; `service` items are arranged by the provider.
        An item without `fulfilment` is treated as `delivery`.

    OptionChoice:
      type: object
      required: [id, label, priceDelta]
      properties:
        id: { type: string, examples: [large] }
        label: { type: string, examples: [Large] }
        priceDelta:
          type: integer
          description: Added to the item's base price, whole US dollars. May be negative.

    OptionGroup:
      type: object
      description: One decision the buyer makes (a material, a size). The first choice is the default.
      required: [id, label, choices]
      properties:
        id: { type: string, examples: [size] }
        label: { type: string }
        choices:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OptionChoice' }

    Personalisation:
      type: object
      description: Free text printed or engraved on the item, or written on a card.
      required: [label, placeholder, maxLength]
      properties:
        label: { type: string, examples: [Message on the card] }
        placeholder: { type: string }
        maxLength: { type: integer }
        required: { type: boolean, description: When true the line must carry non-empty `personalisation`. }

    OrderLineInput:
      type: object
      description: One requested line. Choices only, never prices.
      required: [itemId, options, quantity]
      properties:
        itemId: { type: string, description: A `MarketplaceItem.id`. }
        options:
          type: object
          additionalProperties: { type: string }
          description: |
            The chosen `OptionChoice.id` per `OptionGroup.id`. A group left out takes its first (default) choice;
            a group or choice the item doesn't offer is rejected.
          examples: [{ size: large }]
        quantity: { type: integer, minimum: 1, maximum: 10 }
        personalisation:
          type: string
          description: Required when the item's `personalisation.required` is true, rejected when the item has none, and limited to its `maxLength`.

    DeliveryDetails:
      type: object
      required: [recipientName, phone, town, address]
      properties:
        recipientName: { type: string, minLength: 2, maxLength: 80 }
        phone:
          type: string
          description: A Zimbabwean mobile number in any common form. The server stores and returns it as E.164.
        town:
          type: string
          enum: [Harare, Bulawayo, Mutare, Gweru, Chitungwiza]
        address: { type: string, minLength: 5, maxLength: 200 }
        neededBy:
          type: string
          format: date
          description: When the order is needed by. Not in the past.
        note: { type: string, maxLength: 300 }

    PaymentMethod:
      type: string
      enum: [ecocash, paynow]

    PaymentStatus:
      type: string
      enum: [pending, paid, failed]

    PaymentInput:
      type: object
      required: [method]
      properties:
        method: { $ref: '#/components/schemas/PaymentMethod' }
        ecocashNumber:
          type: string
          description: The EcoCash wallet to charge, an Econet number (077 or 078). Required for `ecocash`.
          examples: ['0771234567']

    NewOrder:
      type: object
      required: [lines, delivery, payment]
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/OrderLineInput' }
        delivery: { $ref: '#/components/schemas/DeliveryDetails' }
        payment: { $ref: '#/components/schemas/PaymentInput' }
        inMemoryOf:
          type: string
          maxLength: 80
          description: Name of the person the order honours, if it was started from a memorial. Longer values are cut to 80 characters.

    OrderStatus:
      type: string
      enum: [awaiting_payment, payment_failed, paid, confirmed, in_progress, delivered, cancelled]
      description: |
        `awaiting_payment` -> `paid` -> `confirmed` -> `in_progress` -> `delivered`. A failed payment moves the
        order to `payment_failed`, from where a new payment attempt returns it to `awaiting_payment`.
        `cancelled` is reserved: nothing in this version of the API produces it.

    OrderLine:
      type: object
      description: A priced line, copied from the catalogue at the time of the order.
      required: [itemId, title, optionLabels, quantity, unitPrice, lineTotal]
      properties:
        itemId: { type: string }
        title: { type: string }
        provider: { type: string }
        image: { type: string, description: An image URL. }
        optionLabels:
          type: array
          items: { type: string }
          description: Human-readable choices in option-group order, e.g. `Black granite`.
        quantity: { type: integer }
        unitPrice:
          type: integer
          description: Base price plus the chosen options' deltas, whole US dollars.
        lineTotal: { type: integer, description: '`unitPrice` times `quantity`.' }
        personalisation: { type: string }

    OrderPayment:
      type: object
      required: [method, status, reference, amount]
      properties:
        method: { $ref: '#/components/schemas/PaymentMethod' }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        reference:
          type: string
          description: Quote this when phoning about the payment. `<order reference>-P<attempt>`.
          examples: [FS-1039-P1]
        amount: { type: integer, description: 'The order total, whole US dollars.' }
        ecocashNumber:
          type: string
          description: Masked, e.g. `+263 77 ••• 4567`. Only for `ecocash`.
        paidAt: { type: string, format: date-time }
        failureReason: { type: string, description: Set when `status` is `failed`. }

    OrderEvent:
      type: object
      required: [at, label]
      properties:
        at: { type: string, format: date-time }
        label: { type: string, examples: [Order placed] }

    Order:
      type: object
      required: [id, reference, status, lines, subtotal, deliveryFee, total, delivery, payment, events, createdAt]
      properties:
        id: { type: string, examples: [o-1039] }
        reference:
          type: string
          description: Human-readable reference a family can quote by phone.
          examples: [FS-1039]
        status: { $ref: '#/components/schemas/OrderStatus' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/OrderLine' }
        subtotal: { type: integer, description: 'Sum of the line totals, whole US dollars.' }
        deliveryFee:
          type: integer
          description: A flat 25 dollars when any line is `delivery`, otherwise 0.
        total: { type: integer, description: '`subtotal` plus `deliveryFee`.' }
        delivery: { $ref: '#/components/schemas/DeliveryDetails' }
        payment:
          description: The latest payment attempt.
          allOf:
            - $ref: '#/components/schemas/OrderPayment'
        events:
          type: array
          description: Oldest first.
          items: { $ref: '#/components/schemas/OrderEvent' }
        inMemoryOf: { type: string }
        createdAt: { type: string, format: date-time }

    Faq:
      type: object
      required: [id, question, answer]
      properties:
        id: { type: string }
        question: { type: string }
        answer: { type: string }

    QuoteRequest:
      type: object
      required: [planId, serviceType, town]
      properties:
        planId:
          type: string
          description: An `id` from `GET /plans`.
        serviceType:
          type: string
          enum: [Traditional burial, Repatriation support, Cemetery planning, Memorial only]
        town:
          type: string
          enum: [Harare, Bulawayo, Mutare, Gweru, Chitungwiza]

    QuoteReceipt:
      type: object
      required: [id, reference, estimatedTotal]
      properties:
        id: { type: string }
        reference:
          type: string
          description: Human-readable reference a family can quote by phone.
          examples: [QR-1001]
        estimatedTotal:
          type: integer
          description: Authoritative total in whole US dollars.

    Phone:
      type: string
      description: |
        A Zimbabwean mobile number in any common form (`0771234567`, `+263 77 123 4567`). The server
        normalises it to E.164 and rejects anything else.
      examples: ['+263771234567']

    User:
      type: object
      required: [id, name, phone, role, language]
      properties:
        id: { type: string }
        name: { type: string }
        phone:
          type: string
          description: E.164, e.g. `+263771234567`. The sign-in identifier.
        email: { type: string, format: email }
        role:
          type: string
          enum: [customer, staff, provider, admin]
          description: The app only uses this to hide screens. Enforce it on the server too.
        language:
          type: string
          enum: [en, sn, nd]

    OtpReceipt:
      type: object
      required: [expiresInSeconds]
      properties:
        expiresInSeconds: { type: integer, examples: [300] }

    SignInRequest:
      type: object
      required: [phone, code]
      properties:
        phone: { $ref: '#/components/schemas/Phone' }
        code:
          type: string
          pattern: '^\d{6}$'

    SignUpRequest:
      type: object
      required: [name, phone, code]
      properties:
        name: { type: string, minLength: 1 }
        phone: { $ref: '#/components/schemas/Phone' }
        code:
          type: string
          pattern: '^\d{6}$'
        email: { type: string, format: email }

    ProfileUpdate:
      type: object
      required: [name, language]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        language:
          type: string
          enum: [en, sn, nd]

    Beneficiary:
      type: object
      required: [name, relationship, share]
      properties:
        name: { type: string }
        relationship: { type: string, examples: [Spouse] }
        share:
          type: integer
          description: Percentage of the benefit. Sums to 100 across a policy.

    PolicyDocument:
      type: object
      required: [id, name, sizeKb]
      properties:
        id: { type: string }
        name: { type: string }
        sizeKb: { type: integer }

    Policy:
      type: object
      required:
        - number
        - planName
        - holderName
        - status
        - coverAmount
        - monthlyPremium
        - paymentDay
        - startDate
        - monthsPaid
        - waitingPeriodMonths
        - beneficiaries
        - documents
      properties:
        number: { type: string, examples: [FLA-204815] }
        planName: { type: string }
        holderName: { type: string }
        status:
          type: string
          enum: [active, grace, lapsed]
        coverAmount:
          type: integer
          description: Benefit paid out, whole US dollars.
        monthlyPremium:
          type: integer
          description: Monthly premium, whole US dollars.
        paymentDay:
          type: integer
          minimum: 1
          maximum: 28
          description: Day of the month the premium falls due.
        startDate: { type: string, format: date }
        monthsPaid: { type: integer }
        waitingPeriodMonths:
          type: integer
          description: Months of premiums before natural-death cover is payable in full.
        beneficiaries:
          type: array
          items: { $ref: '#/components/schemas/Beneficiary' }
        documents:
          type: array
          items: { $ref: '#/components/schemas/PolicyDocument' }

    LinkPolicyRequest:
      type: object
      required: [policyNumber, idNumber]
      properties:
        policyNumber: { type: string, examples: [FLA-318227] }
        idNumber:
          type: string
          description: The holder's national ID number. Checked against the record and never returned.
          examples: [08-765432-B-15]

    AssistanceRequest:
      type: object
      required: [id, reference, kind, message, contactPreference, status, createdAt]
      properties:
        id: { type: string }
        reference:
          type: string
          description: Human-readable reference a family can quote by phone.
          examples: [AR-1042]
        kind:
          type: string
          enum: [bereavement, claim, general]
        message: { type: string, maxLength: 600 }
        contactPreference:
          type: string
          enum: [call, whatsapp, sms]
        status:
          type: string
          enum: [received, assigned, in_progress, complete]
        createdAt: { type: string, format: date-time }
        assignedTo:
          type: string
          description: Name of the adviser handling it, once assigned.

    NewRequest:
      type: object
      required: [kind, message, contactPreference]
      properties:
        kind:
          type: string
          enum: [bereavement, claim, general]
        message:
          type: string
          maxLength: 600
          description: Required (at least 10 characters) when `kind` is `general`; otherwise may be empty.
        contactPreference:
          type: string
          enum: [call, whatsapp, sms]

    MemorialPhoto:
      type: object
      required: [id, url]
      properties:
        id: { type: string, examples: [p-1] }
        url:
          type: string
          description: An image URL. The interim upload stores a `data:` URL here; production returns a hosted URL.
        caption: { type: string, maxLength: 140 }

    TimelineEntry:
      type: object
      required: [id, year, title]
      properties:
        id: { type: string, description: Client-generated, unique within the memorial. }
        year: { type: integer, minimum: 1800, description: Up to and including the current year. }
        title: { type: string, minLength: 1, maxLength: 80 }
        text: { type: string, maxLength: 300 }

    ServiceDetails:
      type: object
      required: [date, venue]
      properties:
        date:
          type: string
          format: date-time
          description: When the funeral or memorial service takes place, with a UTC offset.
        venue: { type: string, minLength: 1, maxLength: 120 }
        address: { type: string, maxLength: 200 }
        note: { type: string, maxLength: 500 }

    Memorial:
      type: object
      description: A remembrance page. The owner's identity is never part of it.
      required: [id, slug, name, born, died, biography, timeline, photos, published, flowers, candles, createdAt]
      properties:
        id: { type: string, examples: [m-1] }
        slug:
          type: string
          description: URL-safe name used in the public address, `/memorials/<slug>`. Unique, and never changes.
          examples: [grace-nyathi]
        name: { type: string, minLength: 1, maxLength: 80 }
        born: { type: string, format: date }
        died: { type: string, format: date }
        tagline: { type: string, maxLength: 120 }
        location: { type: string, maxLength: 80 }
        biography:
          type: string
          maxLength: 6000
          description: Paragraphs separated by a blank line.
        timeline:
          type: array
          maxItems: 20
          description: Sorted by year.
          items: { $ref: '#/components/schemas/TimelineEntry' }
        photos:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/MemorialPhoto' }
        portraitId:
          type: string
          description: The `id` of the photo shown as the portrait. Absent when none is chosen.
        service: { $ref: '#/components/schemas/ServiceDetails' }
        published:
          type: boolean
          description: Unpublished memorials are visible to their owner only.
        flowers: { type: integer, minimum: 0 }
        candles: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }

    OwnedMemorial:
      description: What the owner sees, a memorial plus its moderation counts.
      allOf:
        - $ref: '#/components/schemas/Memorial'
        - type: object
          required: [tributeCount, pendingTributes]
          properties:
            tributeCount:
              type: integer
              description: Approved tributes, the ones the public sees.
            pendingTributes:
              type: integer
              description: Tributes waiting for the owner's decision.

    Tribute:
      type: object
      required: [id, authorName, message, createdAt, status]
      properties:
        id: { type: string }
        authorName: { type: string, maxLength: 60 }
        relationship: { type: string, maxLength: 60, examples: [Neighbour] }
        message: { type: string, minLength: 1, maxLength: 500 }
        createdAt: { type: string, format: date-time }
        status:
          type: string
          enum: [approved, pending, removed]

    NewMemorial:
      type: object
      required: [name, born, died]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        born: { type: string, format: date }
        died:
          type: string
          format: date
          description: Not before `born` and not in the future.
        tagline: { type: string, maxLength: 120 }
        location: { type: string, maxLength: 80 }

    MemorialUpdate:
      type: object
      description: Every field is optional; only those present are changed.
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        born: { type: string, format: date }
        died: { type: string, format: date }
        tagline: { type: string, maxLength: 120 }
        location: { type: string, maxLength: 80 }
        biography: { type: string, maxLength: 6000 }
        timeline:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/TimelineEntry' }
        published: { type: boolean }
        portraitId:
          type: [string, 'null']
          description: The id of one of the memorial's photos, or `null` to clear it.
        service:
          description: '`null` clears the service details.'
          oneOf:
            - $ref: '#/components/schemas/ServiceDetails'
            - type: 'null'

    NewTribute:
      type: object
      required: [authorName, message]
      properties:
        authorName: { type: string, minLength: 1, maxLength: 60 }
        relationship: { type: string, maxLength: 60 }
        message: { type: string, minLength: 1, maxLength: 500 }

    NewPhoto:
      type: object
      required: [dataUrl]
      properties:
        dataUrl:
          type: string
          pattern: '^data:image/(jpeg|png|webp|svg\+xml)'
          description: A JPEG, PNG, WebP or SVG image as a `data:` URL, at most about 1.5 MB. Interim; see the endpoint.
        caption: { type: string, maxLength: 140 }

    OfferingRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [flower, candle]

    OfferingResult:
      type: object
      required: [flowers, candles]
      properties:
        flowers: { type: integer }
        candles: { type: integer }

    Problem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. `validation_failed`.
        message:
          type: string
          description: For logs and developers. The app never shows this to users.
        details:
          description: Optional structured context, e.g. field-level validation messages.
